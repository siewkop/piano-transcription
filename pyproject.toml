[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-transcription"
version = "0.1.0"
description = "Czytelna implementacja autoregresyjnego modelu transkrypcji fortepianu"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6,<3",
    "torchaudio>=2.6,<3",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "soundfile>=0.12,<1",
    "mido>=1.2,<2",
    "pretty-midi>=0.2.10,<1",
    "partitura>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["piano_transcription*", "score_follower*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
